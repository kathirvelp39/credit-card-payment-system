$kind: http-request
url: "{{django_url}}/api/cards/"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "card_type": "CREDIT",
      "card_number": "4242424242424242"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const data = pm.response.json();
        if (data.id) pm.collectionVariables.set('card_id', String(data.id));
      }
      pm.test('Card created successfully', function () { pm.expect(pm.response.code).to.eql(201); });
    language: text/javascript
order: 1000
